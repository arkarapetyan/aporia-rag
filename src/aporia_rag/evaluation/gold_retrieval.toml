# Gold questions for evaluating retrieval (the embedding bake-off).
#
# Each question lists the evidence a good retriever should find: the section
# (document id) and a short verbatim quote from a passage that answers it.
# A retrieved chunk is a *passage hit* when it comes from that section and
# contains the quote (whitespace-insensitive), and a *section hit* when it
# merely comes from that section. Finding any one piece of evidence counts.
#
# Evidence lists *every* passage known to answer the question, not just the
# best one: a passage left out counts as a miss when it is retrieved, so the
# passage-level scores would understate retrieval. Revision history:
# - 2026-10-12: one passage per question, 45 in all.
# - 2026-10-14: corpus searched for every other answering passage, read and
#   judged; 39 passages added, 84 in all. Also fixed two errors: Hume poses the problem
#   of induction in Section IV (only Section V was accepted), and the
#   Descartes quote sat in a fragment that does not say what it is about.
# A passage a model retrieves that answers in words no search anticipated
# still counts as a miss until it is added here.
#
# Writing rules, so the set measures meaning rather than word overlap:
# - Ask as a reader would, in modern English, not in the source's wording.
# - Name the author in some questions and not in others.
# - Quotes are short and verbatim from the edition in data/raw (Hobbes keeps
#   his 1651 spelling); tests/integration checks every quote is findable.

