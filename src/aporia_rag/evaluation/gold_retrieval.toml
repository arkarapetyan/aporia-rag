# Gold questions for evaluating retrieval (the embedding bake-off).
#
# Each question lists the evidence a good retriever should find: the section
# (document id) and a short verbatim quote from the passage that answers it.
# A retrieved chunk is a *passage hit* when it comes from that section and
# contains the quote (whitespace-insensitive), and a *section hit* when it
# merely comes from that section. A question may list several pieces of
# evidence; finding any one of them counts.
#
# Writing rules, so the set measures meaning rather than word overlap:
# - Ask as a reader would, in modern English, not in the source's wording.
# - Name the author in some questions and not in others.
# - Quotes are short and verbatim from the edition in data/raw (Hobbes keeps
#   his 1651 spelling); tests/integration checks every quote is findable.

# --- Plato, Republic ------------------------------------------------------

[[questions]]
id = "plato-thrasymachus"
question = "Who argued that justice is simply whatever benefits those in power?"
[[questions.evidence]]
document = "plato-republic/book-i"
quote = "justice is nothing else than the interest of the stronger"

[[questions]]
id = "plato-invisible-ring"
question = "Would someone still behave justly if they could never be caught or seen?"
[[questions.evidence]]
document = "plato-republic/book-ii"
quote = "possessed by Gyges, the ancestor of Croesus the Lydian"
[[questions.evidence]]
document = "cicero-de-officiis/book-iii"
quote = "Plato introduces the familiar story of Gyges"

[[questions]]
id = "plato-justice-in-the-city"
question = "In Plato's ideal state, what does justice consist in?"
[[questions.evidence]]
document = "plato-republic/book-iv"
quote = "one man should practise one thing only"

[[questions]]
id = "plato-philosopher-rulers"
question = "Who does Socrates think should govern the city if it is ever to be well run?"
[[questions.evidence]]
document = "plato-republic/book-v"
quote = "Until philosophers are kings"

[[questions]]
id = "plato-cave"
question = "What is the image of the prisoners who mistake shadows on a wall for reality?"
[[questions.evidence]]
document = "plato-republic/book-vii"
quote = "human beings living in a underground den"

