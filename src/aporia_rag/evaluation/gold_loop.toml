[[questions.evidence]]
document = "aristotle-nicomachean-ethics/book-vii-chapter-ii"
quote = "his account of the matter is at variance with plain facts"
[[questions.evidence]]
document = "aristotle-nicomachean-ethics/book-vii-chapter-iii"
quote = "the man of Imperfect Self-Control does not think that he ought to pursue it, but does pursue it all the same"
[[questions.evidence]]
document = "aristotle-nicomachean-ethics/book-vii-chapter-iii"
quote = "who though possessed of Knowledge does not call it into operation"
[[questions.evidence]]
document = "aristotle-nicomachean-ethics/book-vii-chapter-iii"
quote = "for a man to know in the one sense, and yet act wrongly, would be nothing strange"
[[questions.evidence]]
document = "aristotle-nicomachean-ethics/book-vii-chapter-iii"
quote = "men under the actual operation of passion are in exactly similar conditions"
[[questions.evidence]]
document = "aristotle-nicomachean-ethics/book-vii-chapter-iii"
quote = "their saying what embodies Knowledge is no proof of their actually then exercising it"
[[questions.evidence]]
document = "aristotle-nicomachean-ethics/book-vii-chapter-iii"
quote = "All action may be analysed into a syllogism"
[[questions.evidence]]
document = "aristotle-nicomachean-ethics/book-vii-chapter-iii"
quote = "the first universal bids him avoid this but the desire leads him on to taste"
[[questions.evidence]]
document = "aristotle-nicomachean-ethics/book-vii-chapter-iii"
quote = "the man of Imperfect Self-Control recovers his Knowledge"
[[questions.evidence]]
document = "aristotle-nicomachean-ethics/book-vii-chapter-iii"
