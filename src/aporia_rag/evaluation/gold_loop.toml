# Gold questions for the corrective loop (query rewriting, then the web).
#
# Same format and judging rule as gold_retrieval.toml, but a separate set, so
# the 40 retrieval questions stay comparable with earlier runs. These are the
# questions where plain retrieval is expected to fail:
#
# - In the corpus, but asked in words far from the source's: modern words for
#   Hobbes's 1651 English ("Covenants Extorted By Feare"), Aristotle's
#   "Imperfect Self-Control" (Chase's word for akrasia), Descartes's
#   "automata", Plato's "royal lie". The loop should find them by rewriting.
# - Not in the corpus (`evidence = []`): a work or an author it does not
#   contain. Every retrieved passage is rightly "not relevant", the loop must
#   start, and the web is the only route. Some are near a topic the corpus
#   does cover (justice, friendship, God), which tests the grader most.
#
# Judging rule (as in gold_retrieval.toml): a passage is evidence when, read on
# its own, it states or argues the author's answer to the question as asked;
# sharing the topic is not enough. A question that names an author accepts only
# that author; one that does not may accept another author's answer. Debatable
# calls are marked "borderline" with the reason.
#
# Revision history:
# - 2026-10-20: 5 questions in the corpus (51 passages, found by keyword
#   searches of all 7,705 chunks and by reading the chapters around each hit)
#   and 4 outside it. Not yet pooled: the passages a model retrieves in words
#   no search anticipated still count as misses until they are judged and added.

# --- In the corpus ----------------------------------------------------------

[[questions]]
id = "promise-under-threat"
question = "Do you have to keep a promise that someone forced out of you with threats?"
# Hobbes: yes, a covenant made from fear binds (unless the law forbids the thing promised).
[[questions.evidence]]
document = "hobbes-leviathan/part-i-of-man-chapter-xiv-of-the-first-and-second-naturall-lawes-and-of-contracts"
quote = "Covenants entred into by fear, in the condition of meer Nature, are obligatory"
[[questions.evidence]]
document = "hobbes-leviathan/part-i-of-man-chapter-xiv-of-the-first-and-second-naturall-lawes-and-of-contracts"
quote = "if I be forced to redeem my selfe from a Theefe by promising him mony, I am bound to pay it"
[[questions.evidence]]
document = "hobbes-leviathan/part-ii-of-common-wealth-chapter-xx-of-dominion-paternall-and-despoticall"
quote = "hold all such Covenants, as proceed from fear of death, or violence, voyd"
[[questions.evidence]]
document = "hobbes-leviathan/part-ii-of-common-wealth-chapter-xx-of-dominion-paternall-and-despoticall"
quote = "Promises proceeding from fear of death, or violence, are no Covenants, nor obliging, when the thing promised is contrary to the Lawes"
[[questions.evidence]]
# borderline: the vanquished man's promise, made to save his life, binds once he is trusted
document = "hobbes-leviathan/part-ii-of-common-wealth-chapter-xx-of-dominion-paternall-and-despoticall"
quote = "upon promise not to run away, nor to do violence to his Master, is trusted by him"
[[questions.evidence]]
# borderline: the vanquished is bound by the covenant he made under threat, not by defeat
document = "hobbes-leviathan/part-ii-of-common-wealth-chapter-xx-of-dominion-paternall-and-despoticall"
quote = "It is not therefore the Victory, that giveth the right of Dominion over the Vanquished, but his own Covenant"
# Cicero: yes to a lawful enemy (Regulus), no to pirates.
[[questions.evidence]]
document = "cicero-de-officiis/book-i"
quote = "if under stress of circumstances individuals have made any promise to the enemy, they are bound to keep their word even then"
[[questions.evidence]]
document = "cicero-de-officiis/book-iii"
quote = "suppose that one does not deliver the amount agreed upon with pirates as the price of one's life"
[[questions.evidence]]
document = "cicero-de-officiis/book-iii"
quote = "Regulus had no right to confound by perjury the terms and covenants of war made with an enemy"
[[questions.evidence]]
# borderline: Regulus's example, praised by Cicero
document = "cicero-de-officiis/book-iii"
quote = "he thought his oath must be sacredly kept"
[[questions.evidence]]
document = "cicero-de-officiis/book-iii"
quote = "As if force could be brought to bear upon a brave man!"
# Schopenhauer: no, a promise extorted by violence does not bind.
[[questions.evidence]]
document = "schopenhauer-world-as-will-vol1/fourth-book-the-world-as-will"
quote = "a promise is certainly not binding when it has been extorted by direct bodily violence"

[[questions]]
id = "hobbes-refusing-orders"
question = "According to Hobbes, which orders from the ruler may a citizen refuse to obey?"
[[questions.evidence]]
# borderline: states the question and the principle the answer is derived from
document = "hobbes-leviathan/part-ii-of-common-wealth-chapter-xxi-of-the-liberty-of-subjects"
quote = "what are the things, which though commanded by the Soveraign, he may neverthelesse, without Injustice, refuse to do"
[[questions.evidence]]
# borderline: the criterion, the end for which sovereignty was instituted
document = "hobbes-leviathan/part-ii-of-common-wealth-chapter-xxi-of-the-liberty-of-subjects"
quote = "or else from the End of the Institution of Soveraignty"
[[questions.evidence]]
document = "hobbes-leviathan/part-ii-of-common-wealth-chapter-xxi-of-the-liberty-of-subjects"
quote = "If the Soveraign command a man (though justly condemned,) to kill, wound, or mayme himselfe"
[[questions.evidence]]
document = "hobbes-leviathan/part-ii-of-common-wealth-chapter-xxi-of-the-liberty-of-subjects"
quote = "he is not bound (without assurance of Pardon) to confesse it"
[[questions.evidence]]
document = "hobbes-leviathan/part-ii-of-common-wealth-chapter-xxi-of-the-liberty-of-subjects"
quote = "When therefore our refusall to obey, frustrates the End for which the Soveraignty was ordained; then there is no Liberty to refuse"
[[questions.evidence]]
document = "hobbes-leviathan/part-ii-of-common-wealth-chapter-xxi-of-the-liberty-of-subjects"
quote = "to avoyd battell, is not Injustice, but Cowardise"
[[questions.evidence]]
document = "hobbes-leviathan/part-ii-of-common-wealth-chapter-xxi-of-the-liberty-of-subjects"
quote = "To resist the Sword of the Common-wealth, in defence of another man, guilty, or innocent, no man hath Liberty"
[[questions.evidence]]
document = "hobbes-leviathan/part-ii-of-common-wealth-chapter-xxi-of-the-liberty-of-subjects"
quote = "And if it be onely to defend their persons, it is not unjust at all"
[[questions.evidence]]
document = "hobbes-leviathan/part-ii-of-common-wealth-chapter-xxi-of-the-liberty-of-subjects"
quote = "The Obligation of Subjects to the Soveraign is understood to last as long, and no longer, than the power lasteth, by which he is able to protect them"

[[questions]]
