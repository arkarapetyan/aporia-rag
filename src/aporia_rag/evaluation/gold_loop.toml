[[questions]]
id = "descartes-machine-or-human"
question = "How could you tell a lifelike robot from a real human being?"
[[questions.evidence]]
document = "descartes-discourse-on-method/part-v"
quote = "there would still remain two most certain tests whereby to know that they were not therefore really men"
[[questions.evidence]]
document = "descartes-discourse-on-method/part-v"
quote = "they could never use words or other signs arranged in such a manner as is competent to us in order to declare our thoughts to others"
[[questions.evidence]]
document = "descartes-discourse-on-method/part-v"
quote = "they did not act from knowledge, but solely from the disposition of their organs"
[[questions.evidence]]
# borderline: applies the first test to men and animals rather than to machines
document = "descartes-discourse-on-method/part-v"
quote = "there are no men so dull and stupid, not even idiots, as to be incapable of joining together different words"

[[questions]]
