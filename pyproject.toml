[project]
name = "aporia-rag"
version = "0.1.0"
description = "A self-correcting (Corrective RAG) question-answering agent over primary philosophical texts, running fully on local models."
readme = "README.md"
authors = [
    { name = "Aren Karapetyan", email = "karapetyanaren.w@gmail.com" },
]
requires-python = ">=3.12"
# Runtime dependencies are added by the component that first needs them,
# so every change to uv.lock is traceable to one piece of the system.
dependencies = [
    "chromadb>=1.5",
    "ddgs>=9.16",
    "fastapi>=0.159",
    "httpx>=0.28",
    "langgraph>=1.2",
    "ollama>=0.6",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "uvicorn>=0.54",
]

[project.scripts]
aporia-rag = "aporia_rag.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168",
    "import-linter>=2.3",
    "mypy>=2.3",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
]

# --------------------------------------------------------------------------
# Testing
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# Makes the shared test doubles importable as `support.fakes` from any test.
pythonpath = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    # Default run = fast, deterministic suite. Opt in with `-m integration` / `-m llm`.
    "-m", "not integration and not llm",
]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "integration: needs the downloaded corpus or the network. Opt-in.",
    "llm: calls the real local Ollama model. Slow and non-deterministic. Opt-in.",
]

[tool.coverage.run]
branch = true
source = ["aporia_rag"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]

# --------------------------------------------------------------------------
# Architecture rules (checked by tests/unit/test_architecture.py)
# --------------------------------------------------------------------------
[tool.importlinter]
root_package = "aporia_rag"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Dependencies point inward: cli > bootstrap > pipelines > adapters and use cases > domain"
type = "layers"
layers = [
    "aporia_rag.cli",
    # The web UI's backend: below the CLI, which serves it (`aporia-rag serve`).
    "aporia_rag.ui",
    "aporia_rag.bootstrap",
    # The pipelines (plain and corrective RAG): they call the use cases, and the composition
    # root builds them.
    "aporia_rag.pipelines",
    # `|`: independent siblings, which must not import each other either.
    "aporia_rag.adapters | aporia_rag.config | aporia_rag.evaluation | aporia_rag.generation | aporia_rag.grading | aporia_rag.indexing | aporia_rag.ingestion | aporia_rag.retrieval",
    "aporia_rag.domain",
]

[[tool.importlinter.contracts]]
id = "provider-libraries"
name = "Provider libraries are used only by adapters"
type = "forbidden"
source_modules = [
    "aporia_rag.config",
    "aporia_rag.domain",
    "aporia_rag.evaluation",
    "aporia_rag.generation",
    "aporia_rag.grading",
    "aporia_rag.indexing",
    "aporia_rag.ingestion",
    "aporia_rag.pipelines",
    "aporia_rag.retrieval",
]
forbidden_modules = ["chromadb", "ddgs", "ollama"]

[[tool.importlinter.contracts]]
id = "web-framework"
name = "FastAPI and its server are used only by the web UI (and the CLI that starts it)"
type = "forbidden"
source_modules = [
    "aporia_rag.adapters",
    "aporia_rag.bootstrap",
    "aporia_rag.config",
    "aporia_rag.domain",
    "aporia_rag.evaluation",
    "aporia_rag.generation",
    "aporia_rag.grading",
    "aporia_rag.indexing",
    "aporia_rag.ingestion",
    "aporia_rag.pipelines",
    "aporia_rag.retrieval",
]
forbidden_modules = ["fastapi", "starlette", "uvicorn"]

[[tool.importlinter.contracts]]
id = "orchestration-framework"
name = "LangGraph is imported only by the corrective pipeline"
type = "forbidden"
source_modules = [
    "aporia_rag.adapters",
    "aporia_rag.bootstrap",
    "aporia_rag.cli",
    "aporia_rag.config",
    "aporia_rag.domain",
    "aporia_rag.evaluation",
    "aporia_rag.generation",
    "aporia_rag.grading",
    "aporia_rag.indexing",
    "aporia_rag.ingestion",
    "aporia_rag.pipelines.outcome",
    "aporia_rag.pipelines.plain",
    "aporia_rag.retrieval",
]
forbidden_modules = ["langgraph"]
# Direct imports only: `cli` and `bootstrap` reach LangGraph through `pipelines.corrective`.
allow_indirect_imports = true

# --------------------------------------------------------------------------
# Linting / formatting
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "PT",       # flake8-pytest-style
    "PL",       # pylint
    "TID",      # flake8-tidy-imports
    "RUF",      # ruff-specific
]
ignore = [
    "SIM905",   # "a b c".split() reads better than a list literal for long word lists
    "PLR0913",  # many parameters are fine when they are keyword-only (after `*`), as here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # literal expected values are the point of a test

[tool.ruff.lint.isort]
known-first-party = ["aporia_rag"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --------------------------------------------------------------------------
# Type checking
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# Name modules by their path from these roots (`support.fakes`, `unit.adapters.conftest`),
# so test files with the same name in different folders do not clash.
mypy_path = ["src", "tests"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
